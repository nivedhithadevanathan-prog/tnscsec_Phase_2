<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <!-- Tamil Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans Tamil', sans-serif;
      font-size: 10px;
      margin: 0;
      padding: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #000;
      padding: 4px;
      text-align: center;
      word-wrap: break-word;
      font-size: 9px;

      white-space: normal;
      line-height: 1.2;
    }

    .top-header {
      font-size: 14px;
      font-weight: bold;
    }

    .top-sub-header {
      font-size: 11px;
      font-weight: bold;
    }

    th {
      background: #f2f2f2;
    }
  </style>
</head>

<body>

<table>

  <thead>

<tr class="top-header">
  <th colspan="10">
    வேட்புமனு பரிசீலனை மற்றும் செல்லத்தக்க வேட்புமனுக்கள் பட்டியல்
  </th>
</tr>

<tr class="top-sub-header">
  <th colspan="10">
    துறை -- {{department_name}}
  </th>
</tr>

<tr>
  <th rowspan="2">வ.எண்</th>
  <th rowspan="2">மாவட்ட தேர்தல் அலுவலர் / மாவட்டம்</th>
  <th rowspan="2">மாவட்ட தேர்தல் அலுவலர் சரகம்</th>

  <th rowspan="2">சங்கம்</th>
  <th rowspan="2">உறுப்பினர் பெயர்</th>
  <th rowspan="2">ஆதார் எண்</th>

  <th rowspan="2">பிரிவு</th>

  <!-- GROUP -->
  <th colspan="3">உறுப்பினர் எண்ணிக்கை</th>
</tr>

<tr>
  <th>ப.இ./ப.கு</th>
  <th>பெண்கள்</th>
  <th>பொது</th>
</tr>

</thead>

  <tbody>
    {{rows}}
  </tbody>

</table>

</body>
</html>
